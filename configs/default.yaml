# Default single-seg configuration.
# Relative paths are resolved from the repo root.

segmenter:
  # Target semantic name. This should match the semantic name in task_info.json.
  target_name: plate

  # Prompt assets.
  prompt_task_info: assets/prompts/libero_spatial/semantic_split_parts/task_info.json
  prompt_image_root: assets/prompts/libero_spatial/semantic_split_parts

  # SAM3 checkpoint.
  checkpoint_path: checkpoints/sam3.pt

  # Default output root for CLI/demo runs.
  output_dir: tests/outputs/demo_spatial_single_object
  overwrite_output: false

  # 2D prompt and tracking thresholds.
  confidence: 0.25
  mask_threshold: 0.6
  prompt_keep_score_threshold: 0.2
  video_mask_prob_threshold: 0.95

  # RGBD backprojection and scene fusion.
  depth_scale: 1000.0
  depth_min: 0.1
  depth_max: 3.0
  stride: 2
  frame_voxel_size: 0.003

  # Target-mask shrinking used only for 3D point selection.
  # 0/1 disables it; values like 3 or 5 remove uncertain mask-boundary pixels before backprojection.
  target_3d_mask_erode_kernel: 0

  # Optional dominant-plane removal for target points, useful when a tabletop is included in the 2D mask.
  target_plane_filter_enabled: false
  target_plane_filter_distance_m: 0.004
  target_plane_filter_min_points: 80
  target_plane_filter_min_inlier_ratio: 0.25
  target_plane_filter_max_inlier_ratio: 0.85
  target_plane_filter_max_planes: 1
  target_plane_filter_ransac_iterations: 256

  # Optional target depth-band filtering for strict point selection.
  target_depth_band_filter_enabled: true
  target_depth_band_filter_range_m: 0.08
  target_depth_band_filter_min_valid_pixels: 50
  target_depth_band_filter_min_keep_pixels: 20

  # Output toggles.
  save_ply: true
  save_normal: false
  save_debug_2d: false

  # Runtime options.
  tracker_image_size: 896

  # Optional target-mask 3D clustering for removing scattered false-positive points.
  target_cluster_filter_enabled: true
  target_cluster_radius_m: 0.025
  target_cluster_min_points: 35
