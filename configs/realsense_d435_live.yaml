# RealSense D435/D435i 实时分割配置文件
# 使用 Fast-FoundationStereo 进行真 RGBD 深度估计
# 相对路径基于仓库根目录解析

# =============================================================================
# 分割器配置
# =============================================================================
segmenter:
  # 目标物体名称，需要与 task_info.json 中的 asset_name 语义名一致
  # 例如: plate, bowl, cup 等
  target_name: plate

  # Prompt 标注文件路径，包含目标物体的参考图片和边界框
  prompt_task_info: assets/prompts/libero_spatial/semantic_split_parts/task_info.json

  # Prompt 图片目录，存放参考图片
  prompt_image_root: assets/prompts/libero_spatial/semantic_split_parts

  # SAM3 模型权重路径
  checkpoint_path: checkpoints/sam3.pt

  # 输出目录
  output_dir: tests/outputs/realsense_live

  # 是否覆盖已有输出
  overwrite_output: true

  # ---------------------------------------------------------------------------
  # SAM3 分割阈值参数
  # ---------------------------------------------------------------------------

  # 置信度阈值，用于过滤低置信度的分割结果
  # 范围: 0.0-1.0，值越高越严格
  confidence: 0.25

  # 掩码二值化阈值，用于将概率图转换为二值掩码
  # 范围: 0.0-1.0，值越高越严格
  mask_threshold: 0.6

  # Prompt 匹配分数阈值，低于此值的 prompt 会被丢弃
  # 范围: 0.0-1.0
  prompt_keep_score_threshold: 0.2

  # 视频掩码概率阈值，用于判断像素是否属于目标物体
  # 范围: 0.0-1.0，值越高越严格
  video_mask_prob_threshold: 0.95

  # ---------------------------------------------------------------------------
  # 深度和点云参数
  # ---------------------------------------------------------------------------

  # 深度有效范围 (米)
  # 小于此值或大于此值的深度会被过滤
  depth_min: 0.1
  depth_max: 3.0

  # 点云采样步长，每隔 stride 个像素采样一个点
  # 值越大点云越稀疏，但处理更快
  stride: 2

  # 帧内点云体素大小 (米)，用于降采样
  # 值越小点云越精细，但点数更多
  frame_voxel_size: 0.003

  # 是否启用目标点 3D 聚类去散点
  # true: 在最终 3D 分割结果里过滤由深度估计噪声造成的零散目标点
  # false: 保留所有被 2D mask 标成目标的 3D 点
  target_cluster_filter_enabled: true

  # 3D 聚类邻域半径 (米)
  # 半径越大，距离较远的目标点越容易连成同一簇；过大可能把背景误连进目标
  target_cluster_radius_m: 0.025

  # 形成有效目标簇所需的最少点数
  # 小于该数量的孤立小簇会被视为散点
  target_cluster_min_points: 35

  # 是否只保留最大目标簇
  # 单物体任务建议 true；如果目标本身会被深度切成多个独立部分，可以设为 false
  target_cluster_keep_largest: true

  # 是否启用目标点主平面剔除
  # true: 在每个相机的目标点云里拟合占比足够大的平面，并把该平面点改回背景
  # 适合目标 mask 把桌面扫进来且桌面与目标在 3D 中连在一起的情况
  target_plane_filter_enabled: false

  # 主平面内点距离阈值 (米)，越大删得越多
  target_plane_filter_distance_m: 0.004

  # 主平面至少需要的内点数量，低于该值时跳过
  target_plane_filter_min_points: 80

  # 主平面内点占目标点的最低比例，低于该比例认为没有明显桌面平面
  target_plane_filter_min_inlier_ratio: 0.25

  # 主平面内点占目标点的最高比例，高于该比例时跳过，避免目标整体被误删
  target_plane_filter_max_inlier_ratio: 0.85

  # 单帧单相机最多剔除几个目标主平面
  # 1 更保守；桌面残留明显时可临时调到 2
  target_plane_filter_max_planes: 1

  # 主平面 RANSAC 迭代次数，越大越稳但越慢
  target_plane_filter_ransac_iterations: 256

  # 是否按目标核心深度带过滤 3D 取点 mask
  # true: 只保留目标 mask 中距离有效深度中位数较近的像素，宁可点少也减少桌面/背景误点
  target_depth_band_filter_enabled: true

  # 目标核心深度带半径 (米)，越小越严格；红杯这类小物体可从 0.012-0.015 试起
  target_depth_band_filter_range_m: 0.08

  # 估计深度中位数所需的最少有效像素，低于该值时跳过过滤
  target_depth_band_filter_min_valid_pixels: 50

  # 过滤后至少保留的像素数，低于该值时跳过过滤，避免整目标被删空
  target_depth_band_filter_min_keep_pixels: 20

  # 反投影前仅用于 3D 取点的目标 mask 腐蚀核大小（像素）
  # 0/1: 关闭；3/5: 去掉 mask 边界处容易混入背景或深度断层的像素
  target_3d_mask_erode_kernel: 0

  # ---------------------------------------------------------------------------
  # 输出选项
  # ---------------------------------------------------------------------------

  # 是否保存点云文件 (PLY 格式)
  save_ply: false

  # 保存 PLY 时是否写入估计法线
  # true: 在 PLY 中增加 nx/ny/nz，法线会翻转到朝向最近相机
  # false: 保持原始 PLY 字段
  save_normal: false

  # 是否保存 2D 调试图 (分割 overlay)
  save_debug_2d: false

  # SAM3 tracker 输入图像尺寸
  # 值越大精度越高，但速度越慢
  # 推荐: 640, 896, 1024
  tracker_image_size: 896

# =============================================================================
# RealSense 相机配置
# =============================================================================
realsense:
  # 相机数量
  camera_count: 1

  # 相机序列号列表 (逗号分隔)
  # 为 null 时自动选择前 N 台相机
  camera_serials: null

  # 多相机位姿文件路径 (JSON 格式)
  # 包含每台相机的 cam2world_4x4 变换矩阵
  # 默认路径与 AprilTag 外参标定脚本的输出一致
  camera_poses_json: tests/outputs/camera_poses_apriltag.json

  # 最大处理帧数，0 表示无限制
  max_frames: 30

  # 相机预热帧数，启动后等待 N 帧稳定
  camera_warmup_frames: 5

  # 帧等待超时时间 (毫秒)
  wait_timeout_ms: 6000

  # ---------------------------------------------------------------------------
  # 分辨率和帧率
  # ---------------------------------------------------------------------------

  # 帧率 (FPS)
  # 低带宽模式推荐: 6
  # 正常模式推荐: 15-30
  fps: 30

  # RGB 彩色图像分辨率
  color_width: 1280
  color_height: 720

  # IR 红外立体图像分辨率 (用于 Fast-FoundationStereo 深度估计)
  # 分辨率越高深度精度越好，但带宽需求更大
  # 推荐值: 1280x720, 848x480, 640x360
  stereo_width: 1280
  stereo_height: 720

  # 立体校正 alpha 参数
  # 0: 裁剪到最大有效区域
  # 1: 保留所有原始像素 (可能有黑边)
  stereo_alpha: 0.0

  # Fast 深度使用的 IR 校正模式
  # opencv: 用左右 IR 内外参重新 stereoRectify（历史默认）
  # passthrough: 直接使用 RealSense 输出的 IR1/IR2，适合验证 D400 已 rectified 的情况
  stereo_rectification_mode: opencv

  # IR 投影器开关；null 表示不改相机当前设置
  # 对 Fast-FoundationStereo 建议分别测试 0/1，散斑可能有帮助也可能带来域差
  emitter_enabled: null

  # ---------------------------------------------------------------------------
  # 深度源选择
  # ---------------------------------------------------------------------------

  # 深度来源:
  # - fast: 使用 IR1/IR2 + Fast-FoundationStereo 估计深度 (真 RGBD)
  # - native: 使用相机原生深度，对齐到 RGB
  depth_source: fast

  # 低带宽模式开关
  # true: 强制使用低分辨率 (color: 640x480, stereo: 480x270, fps: 6)
  # false: 使用配置文件中的分辨率
  # 注意: 低带宽模式下 IR 分辨率太低会导致 Fast 深度质量下降
  low_bandwidth_mode: false

  # 是否保存实时调试图片
  # 包括: RGB, IR 左/右, 深度可视化
  save_live_debug: false

# =============================================================================
# Fast-FoundationStereo 深度估计配置
# 仅当 depth_source=fast 时生效
# =============================================================================
fast_stereo:
  # 模型权重路径
  model_path: third_party/fastfoundationstereo/weights/23-36-37/model_best_bp2_serialize.pth

  # ---------------------------------------------------------------------------
  # 立体匹配参数
  # ---------------------------------------------------------------------------

  # 迭代优化次数
  # 值越大精度越高，但速度越慢
  # 推荐值:
  # - 4: 速度优先
  # - 6: 当前 D435 低带宽数据上的平衡档
  # - 8/12: 质量优先
  valid_iters: 4

  # 最大视差范围 (像素)
  # 物体越近需要越大的视差范围
  # 当前 480x270 rectified IR 下，depth_min=0.1m 时 192 已覆盖近距离视差
  # 只有需要小于约 0.1m 的深度时再考虑 256+
  max_disp: 128

  # cost volume 构建后端
  # pytorch1: 当前数据上稳定且和 triton 速度接近
  # triton: 也可用，但首次运行会有编译开销
  optimize_build_volume: pytorch1

  # Fast depth 对齐到 RGB 的后端
  # torch: 当前 CUDA 投影实现
  # open3d: Open3D tensor 点云投影，避免 librealsense 路径的 GPU->CPU depth 拷贝
  # librealsense: 实验性软件帧 + rs.align 路径
  align_backend: open3d

  # 输入图像缩放比例
  # 1.0: 原始分辨率
  # <1.0: 缩小图像以加速
  scale: 0.75

  # 是否移除不可见点 (遮挡区域)
  remove_invisible: true

  # 是否启用 Fast 深度边缘过滤
  # true: 对对齐到 RGB 后的深度图做 Sobel 深度突变检测，去掉边缘飞点
  # false: 保留原始 Fast 深度
  depth_edge_filter_enabled: false

  # 深度边缘过滤阈值 (米)，参考 Fast-FoundationStereoPhysics demo 默认 0.5
  # 值越小过滤越强，过小会吃掉真实物体边缘
  depth_edge_filter_threshold_m: 0.5

  # 深度边缘过滤位置
  # rectified: 在 IR rectified depth 上过滤，推荐；aligned: 投影到 RGB 后过滤，容易被空洞边界打碎
  depth_edge_filter_stage: rectified

  # 是否使用分层推理 (更精细但更慢)
  hiera: false
