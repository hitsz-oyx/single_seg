# 多相机 mesh 配准参数记录
#
# 注意：当前 register_to_mesh.py 以命令行参数为准，不会自动读取本 YAML。
# 这个文件用于记录当前验证效果较好的参数组合，运行命令见 README.md。

# 数据
data_dir: tests/outputs/realsense_live_small_three_cam_fast
mesh: icp/Register_small.STL
master_camera: cam_00
camera_ids:
  - cam_00
  - cam_01
  - cam_02

# 输出
output_dir: icp/output/Register_small
output: icp/output/Register_small/refined_extrinsics.json

# 当前推荐配准方式
use_goicp: true
refine_use_goicp: true

# Go-ICP 参数
# 这里保持 GoICPConfig() 默认值；只有显式传 CLI 参数时才覆盖 TrimFraction。
goicp_trim_fraction: null
refine_goicp_trim_fraction: null
goicp_defaults:
  voxel_size_ratio: 0.01
  goicp_max_corr_ratio: 0.05
  min_voxel_size: 0.001
  min_goicp_corr: 0.005
  goicp_module: ""
  goicp_quiet: true
  goicp_dt_size: 300
  goicp_dt_factor: 2.0
  goicp_trim_fraction: 0.05
  goicp_mse_thresh: 0.0003
  goicp_epsilon: null
  rotation_only_output: false

# 预处理与 Open3D ICP 兜底参数
voxel_size: 0.003
num_mesh_points: 30000
master_icp_dist: 0.05
refine_icp_dist: 0.003

# 其他输出选项
save_fused: false
visualize: false
